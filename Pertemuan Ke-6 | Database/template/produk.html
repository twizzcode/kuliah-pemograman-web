{{define "content"}}

<h1 class="page-title">Daftar Produk</h1>
<p class="page-sub">Kelola data produk toko.</p>

<a href="/produk/form" class="btn">+ Tambah Baru</a>

{{if .Produk}}
<div class="table-card">
    <table>
        <thead>
            <tr>
                <th style="width: 60px;">No</th>
                <th>Nama</th>
                <th>Harga</th>
                <th style="width: 90px;">Stok</th>
            </tr>
        </thead>
        <tbody>
            {{range $i, $p := .Produk}}
            <tr>
                <td>{{add $i 1}}</td>
                <td>{{$p.Name}}</td>
                <td class="price">Rp {{$p.Price}}</td>
                <td>{{$p.Stok}}</td>
            </tr>
            {{end}}
        </tbody>
    </table>
</div>
{{else}}
<div class="table-card">
    <div class="empty">Belum ada produk. Klik <b>Tambah Baru</b> untuk menambahkan.</div>
</div>
{{end}}

{{end}}
