{{define "content"}}

<h3>Form Produk</h3>

<form action="/produk/simpan" method="POST">
    <p>
        <label>Nama:</label><br>
        <input type="text" name="nama" required>

<br>
<a href="/produk">Kembali ke Daftar Produk</a>

{{end}}
